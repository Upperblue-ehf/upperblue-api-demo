name: Check Python demos
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python seismic.py
      - run: python tides.py
